<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLA — AI Command Center</title>
    <style>
        :root {
            --bg-color: #030712;
            --accent-blue: #00d2ff;
            --accent-sapphire: #3a86ff;
            --glow-color: rgba(0, 210, 255, 0.4);
            --text-color: #e2e8f0;
            --panel-bg: rgba(15, 23, 42, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        /* HUD Header */
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-blue);
            text-shadow: 0 0 8px var(--accent-blue);
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid #00ff88;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Sapphire Core Animation */
        .core-container {
            position: relative;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-ring {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px dashed var(--accent-blue);
            animation: rotateRing 12s linear infinite;
            position: absolute;
        }

        .core-glow {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-blue) 0%, var(--accent-sapphire) 60%, transparent 100%);
            box-shadow: 0 0 35px var(--accent-blue);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 50px var(--accent-blue); }
        }

        /* Console Output */
        .console {
            width: 100%;
            max-width: 800px;
            height: 320px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.system {
            align-self: flex-start;
            background: rgba(58, 134, 255, 0.15);
            border-left: 3px solid var(--accent-sapphire);
            color: #dbeaff;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(0, 210, 255, 0.2);
            border-right: 3px solid var(--accent-blue);
            color: #ffffff;
        }

        /* Input Controls */
        .input-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px var(--glow-color);
        }

        button {
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--accent-sapphire), var(--accent-blue));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            box-shadow: 0 0 12px var(--glow-color);
        }

        .mic-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-blue);
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">ELLA HUD</div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </header>

    <div class="core-container">
        <div class="core-ring"></div>
        <div class="core-glow"></div>
    </div>

    <div class="console" id="console">
        <div class="message system">
            <strong>[ELLA System]:</strong> Система автоматизации и модуль управления готовы. Ожидаю указаний.
        </div>
    </div>

    <div class="input-bar">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</button>
        <input type="text" id="userInput" placeholder="Введите команду или геологические координаты..." onkeypress="handleKeyPress(event)">
        <button onclick="sendCommand()">Отправить</button>
    </div>

    <script>
        const API_URL = "https://ella-backend-yq1s.onrender.com/command";

        async function sendCommand() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage("user", text);
            input.value = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command: text })
                });

                const data = await response.json();
                appendMessage("system", data.response || JSON.stringify(data));
            } catch (err) {
                appendMessage("system", " Ошибка соединения с бэкендом: " + err.message);
            }
        }

        function appendMessage(sender, text) {
            const consoleBox = document.getElementById("console");
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            msg.innerHTML = `<strong>[${sender === 'user' ? 'Вы' : 'ELLA'}]:</strong> ${text}`;
            consoleBox.appendChild(msg);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendCommand();
        }

        // Voice Input Integration
        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Голосовой ввод не поддерживается вашим браузером.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';

            recognition.onstart = () => {
                document.getElementById("micBtn").style.borderColor = "#00ff88";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById("userInput").value = transcript;
                sendCommand();
            };

            recognition.onend = () => {
                document.getElementById("micBtn").style.borderColor = "var(--accent-blue)";
            };

            recognition.start();
        }
    </script>
</body>
</html>
